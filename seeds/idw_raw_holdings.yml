version: 2

seeds:
  - name: idw_raw_holdings
    schema: idw_landing
    alias: idw_raw_holdings
    description: >
      Daily end-of-day holdings positions sourced from the CDW domain.
      One row per (valuation_date, portfolio_code, isin) representing a
      single instrument position within a portfolio on a given business day.
    config:
      column_types:
        valuation_date:     date
        portfolio_code:     varchar
        isin:               varchar
        quantity:           bigint
        market_value_base:  double
        weight_pct:         double

    columns:
      - name: valuation_date
        description: Business day on which the position was valued (ISO 8601 date).
        tests:
          - not_null

      - name: portfolio_code
        description: Foreign key to raw_portfolios.portfolio_code.
        tests:
          - not_null
          - relationships:
              to: ref('raw_portfolios')
              field: portfolio_code

      - name: isin
        description: Foreign key to raw_instruments.isin.
        tests:
          - not_null
          - relationships:
              to: ref('raw_instruments')
              field: isin

      - name: quantity
        description: Number of units held (shares for equities, face-value units for bonds).
        tests:
          - not_null

      - name: market_value_base
        description: Market value of the position expressed in the portfolio base currency.
        tests:
          - not_null

      - name: weight_pct
        description: >
          Position weight as a percentage of total portfolio NAV
          (re-normalised to 100 % each day).
        tests:
          - not_null
